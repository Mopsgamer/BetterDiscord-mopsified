name: Build Native Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Build Frontend
        run: |
          cd installer
          bun install
          bun run dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterDiscord-Installer-${{ matrix.platform }}
          path: |
            installer/dist/bin/*
