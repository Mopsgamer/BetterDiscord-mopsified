name: Build Installer

on:
  push:
    branches: [ rewrite ]
  pull_request:
    branches: [ rewrite ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install perry
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            brew tap PerryTS/perry
            brew install perry
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            curl -fsSL https://perryts.com/install.sh | bash
          else
            winget install PerryTS.Perry
          fi

      - name: install dependencies
        run: bun install

      - name: compile native installer
        run: |
          cd installer
          perry compile src/index.ts -o bd-installer --enable-js-runtime

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterDiscord-Installer-${{ matrix.platform }}
          path: |
            installer/bd-installer
            installer/bd-installer.exe
